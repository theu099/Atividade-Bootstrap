<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Projeto - Bootstrap e JavaScript</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <div class="card shadow-sm" style="width: 18rem;" id="meuCard">
    <div class="card-body text-center">
      <h5 class="card-title" id="titulo">Estado Inicial</h5>
      <p class="card-text" id="texto">Este é o estado padrão, antes de clicar no botão.</p>
      <button class="btn btn-primary w-100" id="botao">Alternar Estado</button>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Pegando os elementos da página pelo id
    const card = document.getElementById('meuCard');
    const titulo = document.getElementById('titulo');
    const texto = document.getElementById('texto');
    const botao = document.getElementById('botao');

    // Guarda se o estado está ativo ou não
    let ativo = false;

    botao.addEventListener('click', function () {
      ativo = !ativo;

      if (ativo) {
        titulo.textContent = 'Estado Atualizado!';
        texto.textContent = 'O JavaScript mudou o texto e as cores do card.';
        card.classList.add('bg-dark', 'text-white');
        botao.classList.replace('btn-primary', 'btn-success');
      } else {
        titulo.textContent = 'Estado Inicial';
        texto.textContent = 'Este é o estado padrão, antes de clicar no botão.';
        card.classList.remove('bg-dark', 'text-white');
        botao.classList.replace('btn-success', 'btn-primary');
      }
    });
  </script>
</body>
</html>
